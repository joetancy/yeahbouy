name: Package app

on:
  push:
    branches: [main]
    tags: ["20??-??-??*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: YeahBouy-macos-apple-silicon
          - os: macos-15-intel
            artifact: YeahBouy-macos-intel
          - os: windows-latest
            artifact: YeahBouy-windows
          - os: ubuntu-latest
            artifact: YeahBouy-linux

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux native libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake pkg-config libasound2-dev libfontconfig1-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-cursor-dev libvulkan-dev libglib2.0-dev

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build app
        run: |
          cargo build --release --locked
          bash scripts/package.sh

      - name: Verify macOS app signature
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict --verbose=2 dist/native/YeahBouy.app

      - name: Archive app
        env:
          ARCHIVE_NAME: ${{ matrix.artifact }}
        run: |
          python - <<'PY'
          import os
          import shutil
          import subprocess
          import sys
          from pathlib import Path

          source = Path("dist/native/YeahBouy.app" if sys.platform == "darwin" else "dist/native/YeahBouy")
          archive = f"{os.environ['ARCHIVE_NAME']}.zip"
          if sys.platform == "darwin":
              subprocess.run(["ditto", "-c", "-k", "--sequesterRsrc", "--keepParent", str(source), archive], check=True)
          else:
              shutil.make_archive(os.environ["ARCHIVE_NAME"], "zip", root_dir=source.parent, base_dir=source.name)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: YeahBouy-*
          merge-multiple: true

      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
          gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
          gh release delete-asset "$GITHUB_REF_NAME" YeahBouy.zip --yes || true
          gh release upload "$GITHUB_REF_NAME" release-assets/*.zip --clobber
