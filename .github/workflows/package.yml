name: Package app

on:
  push:
    tags: ["*-*-*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: YeahBouy-macos-apple-silicon
            add-data: assets/checkpoint-menubar.svg:assets
            icon: --icon assets/checkpoint.icns
            signing: --codesign-identity - --osx-entitlements-file assets/entitlements.plist
          - os: macos-15-intel
            artifact: YeahBouy-macos-intel
            add-data: assets/checkpoint-menubar.svg:assets
            icon: --icon assets/checkpoint.icns
            signing: --codesign-identity - --osx-entitlements-file assets/entitlements.plist
          - os: windows-latest
            artifact: YeahBouy-windows
            add-data: assets/checkpoint-menubar.svg;assets
            icon: ""
          - os: ubuntu-latest
            artifact: YeahBouy-linux
            add-data: assets/checkpoint-menubar.svg:assets
            icon: ""

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux Qt libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest pyinstaller

      - name: Run tests
        run: python -m pytest

      - name: Build app
        run: >-
          pyinstaller --noconfirm --windowed --name YeahBouy
          ${{ matrix.icon }}
          ${{ matrix.signing }}
          --add-data "${{ matrix.add-data }}"
          main.py

      - name: Verify macOS app signature
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict --verbose=2 dist/YeahBouy.app

      - name: Archive app
        env:
          ARCHIVE_NAME: ${{ matrix.artifact }}
        run: |
          python - <<'PY'
          import os
          import shutil
          import subprocess
          import sys
          from pathlib import Path

          source = Path("dist/YeahBouy.app" if sys.platform == "darwin" else "dist/YeahBouy")
          archive = f"{os.environ['ARCHIVE_NAME']}.zip"
          if sys.platform == "darwin":
              subprocess.run(["ditto", "-c", "-k", "--sequesterRsrc", "--keepParent", str(source), archive], check=True)
          else:
              shutil.make_archive(os.environ["ARCHIVE_NAME"], "zip", root_dir=source.parent, base_dir=source.name)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: YeahBouy-*
          merge-multiple: true

      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
          gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
          gh release delete-asset "$GITHUB_REF_NAME" YeahBouy.zip --yes || true
          gh release upload "$GITHUB_REF_NAME" release-assets/*.zip --clobber
